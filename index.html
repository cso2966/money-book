<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>살이되고 돈이되는 가계부</title>
<meta name="theme-color" content="#76ACA7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="살돈 가계부">
<script src="cloud-config.js"></script>

<style>:root{
  --mint:#76ACA7; --mint-d:#5a918c; --mint-l:#EEF8F5; --mint-2:#d7ebe7;
  --bg:#F4F5F4; --card:#fff; --ink:#3d4443; --ink-2:#6b7473; --ink-3:#9aa3a2;
  --line:#e3e7e6; --line-2:#eef1f0; --red:#e07a6f; --blue:#6f9bd1; --amber:#e0b35a;
  --radius:12px; --shadow:0 1px 2px rgba(30,50,48,.06),0 4px 14px rgba(30,50,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mint-d)}
#app{display:flex;height:100vh}
/* sidebar */
#side{width:232px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line-2)}
.brand b{display:block;font-size:17px;letter-spacing:-.3px}
.brand small{color:var(--ink-3);font-size:11.5px;letter-spacing:.4px}
.nav{padding:8px 10px 20px;flex:1}
.nav h6{margin:14px 10px 4px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.5px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--line-2)}
.nav a.on{background:var(--mint-l);color:var(--mint-d);font-weight:600}
.nav .months{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 6px}
.nav .months a{justify-content:center;padding:6px 0;font-size:12.5px;border:1px solid var(--line-2)}
.nav .months a.cur{border-color:var(--mint)}
.sidefoot{padding:12px 14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3)}
.sidefoot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:5px;vertical-align:1px}
/* main */
#main{flex:1;overflow:auto}
.page{max-width:1280px;margin:0 auto;padding:26px 30px 80px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:24px;letter-spacing:-.5px}
.ph .sub{color:var(--ink-2);font-size:13px;margin-bottom:3px}
.ph .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.en{font-size:12px;color:var(--mint);font-weight:600;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:2px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-3)}
.card h4{margin:14px 0 8px;font-size:13.5px;color:var(--ink-2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid>.card{margin-bottom:0}
.mb{margin-bottom:16px}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){#side{display:none}.g2,.g3,.g4,.g5{grid-template-columns:1fr}.page{padding:16px}}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:4px}
.kpi.accent{background:var(--mint);color:#fff}.kpi.accent .l,.kpi.accent .s{color:#e8f5f3}
.pos{color:#d4574a}.neg{color:#4a7fc4}
.muted{color:var(--ink-3)}.small{font-size:12px}
.hint{font-size:12px;color:var(--ink-3);margin:4px 0 10px}
.hint::before{content:"👇 "}
.note{background:var(--mint-l);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:#41615e;white-space:pre-line}
.warn{background:#fdf3e8;color:#8a5b22}
/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--mint);color:var(--mint-d)}
.btn.p{background:var(--mint);border-color:var(--mint);color:#fff}.btn.p:hover{background:var(--mint-d)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.tog{border-radius:20px;font-size:12px;padding:4px 11px}
.tog.on{background:var(--mint);color:#fff;border-color:var(--mint)}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{background:var(--mint);color:#fff;font-weight:600;padding:8px 8px;white-space:nowrap;position:sticky;top:0;z-index:1;font-size:12.5px}
table.t.light th{background:#F2F2F2;color:var(--ink)}
table.t td{border-top:1px dashed #dcdcdc;padding:6px 8px;vertical-align:middle}
table.t td.n,table.t th.n{text-align:right}
table.t td.c{text-align:center}
table.t tr.sum td{background:var(--mint-l);font-weight:700;border-top:1px solid var(--mint-2)}
table.t tr.sub td{background:#f7fbfa;font-weight:600}
table.t tr.sum2 td{background:#FAFAFA;font-weight:600}
table.t td.calc{background:#fafbfb;color:var(--ink-2)}
table.t td.in{padding:0}
table.t td.in input,table.t td.in select,table.t td.in textarea{width:100%;border:0;background:transparent;padding:7px 8px;outline:none;min-width:60px}
table.t td.in textarea{resize:vertical;min-height:32px;display:block}
table.t td.in input:focus,table.t td.in select:focus,table.t td.in textarea:focus{background:#fffbe9;box-shadow:inset 0 0 0 2px var(--mint)}
table.t td.in input.num{text-align:right}
table.t td.act{width:30px;text-align:center;padding:0}
table.t .x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;padding:4px 6px}
table.t .x:hover{color:var(--red)}
table.t tr:hover td.in{background:#fcfdfd}
table.t td.mid{background:#fbfdfc;text-align:center;font-weight:600}
.tfoot{display:flex;gap:8px;margin-top:8px;align-items:center}
/* forms */
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-l)}
.fld .unit{font-size:11px;color:var(--ink-3)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.fld{flex:1;min-width:120px}
input.num{text-align:right}
select.inl,input.inl{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff}
/* progress */
.bar{height:9px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mint);border-radius:6px}
.bar.big{height:14px}
/* charts */
.chart{width:100%;display:block}
.chart text{font-family:inherit;fill:var(--ink-2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donutwrap svg{flex:none}
.donutwrap .legend{flex-direction:column;gap:5px;margin:0;flex:1;min-width:150px}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:26px 0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11.5px;color:var(--ink-3);padding:4px 0;font-weight:600}
.cal .d{min-height:62px;border-radius:8px;background:#fafbfb;padding:5px 6px;font-size:11.5px;display:flex;flex-direction:column;border:1px solid transparent}
.cal .d.blank{background:transparent}
.cal .d .dn{font-weight:600;color:var(--ink-2)}
.cal .d .amt{margin-top:auto;text-align:right;font-weight:600;color:#c6665b;font-size:11.5px}
.cal .d.zero .amt{color:var(--mint-d)}
.cal .d.zero{background:var(--mint-l)}
.cal .d.today{border-color:var(--mint)}
.cal .d.future{opacity:.55}
/* misc */
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--line-2);font-size:11.5px;color:var(--ink-2)}
.pill.g{background:var(--mint-l);color:var(--mint-d)}.pill.r{background:#fbe9e6;color:#b55246}.pill.b{background:#e9f0fa;color:#4a7fc4}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.list li:last-child{border-bottom:0}
.list li .r{margin-left:auto;font-variant-numeric:tabular-nums}
.toast{position:fixed;right:20px;bottom:20px;background:#2f3a39;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--mint-d);border-color:var(--mint);font-weight:600}
.step{font-size:16px;font-weight:700;margin:26px 0 6px;color:var(--ink)}
.step small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.score{font-size:42px;font-weight:800;color:var(--mint-d);letter-spacing:-1px}
.big{font-size:20px;font-weight:700}
.catblock{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.catblock .hd{display:flex;gap:8px;align-items:center;background:#fafbfb;padding:8px 10px;border-bottom:1px solid var(--line)}
.catblock .hd input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:20px;background:#fff;padding:0 4px 0 2px}
.chip input{border:0;outline:none;padding:5px 6px;width:112px;background:transparent}
.chip button{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0 4px}
.chip button:hover{color:var(--red)}
.dlg{position:fixed;inset:0;background:rgba(30,40,40,.35);display:flex;align-items:center;justify-content:center;z-index:40}
.dlg .box{background:#fff;border-radius:14px;padding:22px;max-width:560px;width:calc(100% - 40px);box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:85vh;overflow:auto}
.dlg h3{margin:0 0 10px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.navgrid a{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.navgrid a:hover{border-color:var(--mint)}
.navgrid a b{display:block;font-size:13.5px}.navgrid a span{font-size:12px;color:var(--ink-3)}
textarea.goal{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;outline:none;line-height:1.6}
textarea.goal:focus{border-color:var(--mint)}
@media print{#side,.tools,.btn{display:none!important}#main{overflow:visible}.page{max-width:none}}

.nw{white-space:nowrap}

.kpi.click{cursor:pointer;transition:transform .12s,box-shadow .12s}.kpi.click:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,110,105,.18)}.kpi .go{float:right;font-size:12px;opacity:.65}.kpi.click:hover .go{opacity:1}.kpi .s a{cursor:pointer;text-decoration:underline dotted}

.srclink{cursor:pointer;color:var(--mint-d);font-size:12px;white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:2px 7px;background:#fff}.srclink:hover{background:var(--mint-l)}
.srcraw{background:#fffbe6;border:1px solid #f0e2a8;border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap;word-break:break-all}
.srctbl td{font-size:12px;white-space:nowrap}.srctbl tr.hit td{background:#fff3b0!important;font-weight:600}
.srctext{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:inherit}.srctext div{padding:2px 4px;white-space:pre-wrap}.srctext div.hit{background:#fff3b0;font-weight:600;border-radius:4px}.pgmark{display:block;color:var(--ink-3,#999);font-size:11px;margin:6px 0 2px}

th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{filter:brightness(1.08)}th .sarr{font-size:10px;margin-left:4px;opacity:.55}th.sorted .sarr{opacity:1;font-size:11px}

/* ---------- 💬 채팅 입력 ---------- */
.chwrap{display:flex;flex-direction:column;height:calc(100vh - 60px);max-width:720px;margin:0 auto;background:#eef3f2;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.chhead{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}.chhead>div{flex:1}.chhead b{font-size:16px}
.chlog{flex:1;overflow-y:auto;padding:12px 10px 6px;-webkit-overflow-scrolling:touch}
.cb{display:flex;margin:6px 0}.cb>div{max-width:84%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.5;word-break:break-word}
.cb.me{justify-content:flex-end}.cb.me>div{background:var(--mint);color:#fff;border-bottom-right-radius:4px}
.cb.bot{flex-direction:column;align-items:flex-start;gap:6px}.cb.bot>div{background:#fff;border-bottom-left-radius:4px;box-shadow:0 1px 2px #0001}
.mcard{width:min(84vw,440px);box-sizing:border-box}.mcard.gone{opacity:.5}
.mtop{display:flex;gap:8px;align-items:baseline}.mtop b{flex:1;font-size:15.5px}.mamt{font-weight:800;font-size:16.5px;color:var(--mint-d)}
.mcat{font-size:13.5px;margin-top:3px;color:#3d5a57}.mnone{color:#c9822b}.mmeta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.mfoot{display:flex;align-items:center;gap:6px;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}.mst{font-size:12px;color:var(--ink-3);flex:1}.mst.s-done{color:#2f8a5f;font-weight:600}
.mfoot button,.mbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:#33504d;cursor:pointer}
.mcard.edit label{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}.mcard.edit input,.mcard.edit select{display:block;width:100%;box-sizing:border-box;font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-top:2px;background:#fff}
.mbtns{display:flex;gap:8px;margin-top:10px}.mbtns button{flex:1;padding:9px}.mbtns .p{background:var(--mint);color:#fff;border-color:var(--mint)}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none;background:#eef3f2}.mchips button{flex:none;border:1px solid #cfe0dd;background:#fff;border-radius:16px;padding:6px 12px;font-size:13.5px;color:#33504d;cursor:pointer}
.mform{display:flex;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid var(--line)}
.mform textarea{flex:1;resize:none;font-size:16px;border:1px solid #cfe0dd;border-radius:20px;padding:9px 14px;font-family:inherit;outline:none;max-height:120px}
.mform button{width:44px;height:44px;border-radius:50%;border:0;background:var(--mint);color:#fff;font-size:18px;align-self:flex-end;cursor:pointer}
#mtop,#mtab,#mshade{display:none}
/* ---------- 📱 휴대폰 화면 ---------- */
@media(max-width:760px){
  #app{height:100dvh}
  #side{display:flex!important;position:fixed;top:0;left:0;bottom:0;width:270px;z-index:60;transform:translateX(-105%);transition:transform .22s;box-shadow:4px 0 20px #0002}
  body.drawer #side{transform:none}
  #mshade{position:fixed;inset:0;background:#0004;z-index:55}body.drawer #mshade{display:block}
  #mtop{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;height:50px;padding:0 12px;padding-top:env(safe-area-inset-top);background:#fff;border-bottom:1px solid var(--line);z-index:50}
  #mtop button{border:0;background:none;font-size:22px;padding:4px 6px}#mtop b{flex:1;font-size:16px}#mtop a{text-decoration:none;font-size:18px}
  #mtab{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  #mtab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:11px;color:var(--ink-2);text-decoration:none;cursor:pointer}#mtab a span{font-size:19px;line-height:1.1}#mtab a.on{color:var(--mint-d);font-weight:700}
  #main{padding-top:50px;padding-bottom:62px}
  .page{padding:12px 10px 20px}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:12px 13px}.kpi .v{font-size:18px}
  .ph h1{font-size:20px}.ph .tools{margin-left:0}
  .card{padding:14px 12px}
  .chwrap{height:calc(100dvh - 50px - 62px - 24px);border-radius:12px}
  .page:has(.chwrap){padding:8px 6px 4px}
  #qkfab{display:none!important}
  .dlg .box{width:calc(100% - 20px);padding:16px;max-height:88vh}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>살이되고<br>돈이되는 가계부</b><small>HEALTH · MONEY</small></div>
    <nav class="nav" id="navbox"></nav>
    <div class="sidefoot" id="saveinfo"><span class="dot"></span>이 PC의 브라우저에 자동 저장됩니다</div>
  </aside>
  <main id="main"></main>
</div>
<script>'use strict';
/* =========================================================
   살이되고 돈이되는 가계부 (core)
   ========================================================= */
const APP_VER = '2.0';
const APP_NAME = '살이되고 돈이되는 가계부', APP_SHORT = '살돈 가계부';
const SELF_G = '내 계좌 이체'; // 내 계좌끼리 옮긴 돈 (합계 제외)
const IS_MOBILE = (location.protocol === 'http:' && /^4783[0-4]$/.test(location.port)) || /[?&]mobile=1/.test(location.search);
const LS_KEY = 'donsaldon-v1', LS_OLD = ['jo' + 'yce-moneykit-v1']; // 예전 이름으로 저장된 데이터는 한 번 옮겨옴
const GROUPS = { income: '수입', fixed: '고정지출', saving: '저축', invest: '투자', variable: '변동지출' };
const GROUP_KEYS = ['income', 'fixed', 'saving', 'invest', 'variable'];

 전세대출 정도가 \n있는 사람들에게 자주 나타나며,\n\n매달 상환은 가능하지만 ‘더 저축하거나 투자할 수 있었던 돈’이 \n줄어들고 있는 구조이기도 합니다.\n\n\n✔️ 이 시기에는 대출을 늘리기보단 \n재정 점검 & 상환 속도 조절이 중요합니다.\n\n✔️ 특히 금리가 높은 부채가 있다면 \n우선적으로 갚는 전략을 설계하세요.", "rep_AL80": "당신은 사실상 부채 없이 사는 사람입니다.\n\n\n소득에서 부채 상환이 차지하는 비중이 10% 이하라면\n\n신용대출, 카드론, 자동차 할부, 학자금 등\n\n어떠한 고정 채무도 거의 없거나\n\n있더라도 상환 관리가 매우 잘 되고 있는 상태입니다.\n\n\n이 단계에 있는 사람은 현금 흐름의 자율성이 높기 때문에\n\n남는 자금의 투자/저축 전략을 유연하게 조정할 수 있으며,\n\n장기적인 자산 설계가 빠르게 가능합니다.\n\n\n✔️ 이때는 ‘무이자 혜택’ 등만 활용하고,\n\n불필요한 대출은 만들지 않는 것이 최선입니다.", "rep_AJ175": "이 수치는 명백한 위기 신호입니다.\n\n전체 자산 중 대부분이 부채로 구성돼 있다는 뜻으로,\n‘내 자산’이라고 부르기엔 실질 소유권이 거의 없는 상태입니다.\n\n이 단계는 부동산을 레버리지로 구입한 사람,\n혹은 신용대출/카드론/마이너스통장을 \n자산처럼 인식하고 있는 구조에서 자주 나타나며,\n\n금리 상승·부동산 가격 하락 등 변수 하나로 \n전체 재무 구조가 붕괴될 위험이 큽니다.\n\n당장 필요한 건 ‘투자’가 아니라,\n\n✔️ 고정 지출 점검, ✔️ 채무 구조조정, ✔️ 자산 매각 등 \n     구조 설계 리셋입니다.\n\n❗ 특히 ‘본인이 부자’ 라고 느끼지만, 이 지표가 80% 이상이라면\n\n그 자산은 아직 ‘미래의 것’일 뿐, \n지금의 부채에 의해 통제받는 구조임을 직시해야 합니다.", "rep_AJ176": "자산이 있는 듯 보이지만,\n사실 절반 이상이 빚으로 세워진 구조입니다.\n\n예를 들어 3억 자산이라 해도, 부채가 1.5억~2.5억이라면\n‘내 순자산’은 고작 5천만 원 이하일 수 있습니다.\n\n이런 구조에선 투자나 소비보다\n\n✔️ ‘빚을 줄이는 전략’이 최우선이며,\n\n✔️ ‘자산의 질과 유동성’ 을 함께 점검해야 합니다.\n\n고정 수입이 줄거나 자산가치가 하락할 경우\n빚만 남고 실질 자산이 무너지는 리스크가 존재합니다.\n\n자산 중 특히 유동화 어려운 비중이 많다면\n\n⚠️ 구조 전체를 리밸런싱해야 할 시점입니다.", "rep_AJ177": "자산이 적지 않음에도 불구하고, \n부채가 전체의 1/3 ~ 1/2를 차지한다면,\n\n위기 시, 자산이 한순간에 무너질 수 있는 불안한 구조입니다.\n\n특히 주택담보대출, 전세대출 등의 장기채무가 많을수록\n‘내 것’ 같지만\n사실은 아직 소유권이 나에게 오지 않은 자산이 많다는 뜻입니다.\n\n이 구간에서는\n자산 대비 부채 속도를 점검하고\n\n자산 증식보다 부채 감축을 우선순위로 두는 것이 핵심입니다.\n\n실제로 상환을 어느 정도 마치면\n순자산이 빠르게 늘어나게 되어\n\n그 이후엔 투자·저축 전략이 훨씬 유리합니다.", "rep_AJ178": "당신의 자산 중 부채가 차지하는 비중이 30% 이하라면,\n\n상당히 안정적인 자산 구조를 가지고 있습니다.\n\n\n예를 들어 총 자산이 3억인데 부채가 9천만 원 이하라면\n\n‘빚’보다는 ‘순자산’의 힘으로 살아가고 있는 구조입니다.\n\n\n이 구조는 위기 대응 능력도 뛰어나며,\n\n향후 신용 대출을 전략적으로 활용하거나,\n\n비상시에 일부 자산을 유동화하는 것도 비교적 수월합니다.\n\n\n지금처럼 유지하되,\n\n투자 비중과 비상금 확보의 균형을 맞춰\n\n장기적 자산 증식으로 넘어갈 수 있는 골든타임입니다.", "rep_AK175": "소득 중 40% 이상을 저축이나 투자로 남기고 있다는 건\n\n단순히 절약하는 차원을 넘어,\n삶의 우선순위를 ‘지금’이 아닌 ‘미래’에 두고 있다는 뜻입니다.\n\n당신은 매달 들어오는 돈이 곧 자산이 되는 흐름을 만들고 있으며,\n이것은 장기적으로\n자유, 선택권, 안정감을 만들어내는 강력한 구조입니다.\n\n이러한 사람은 대개 다음과 같은 특징을 보입니다:\n\n✔️ 지출보다 저축이 먼저 빠져나가는 자동 시스템이 있음\n✔️ 예/적금뿐 아니라 ETF, 연금저축, IRP 같은 \n     중장기 설계도 함께 함\n✔️ 월별 소비보다 연간 자산 증가율을 더 중요하게 여김\n\n당신은 이미 ‘준비된 사람’이자,\n능동적 자산가의 시점에 도달한 사람입니다.\n\n앞으로 필요한 건 단지 ‘얼마를 남길까?’가 아닌\n그 돈을 어떻게 설계할 것인가?입니다.\n", "rep_AK176": "당신은 미래를 완전히 무시하지는 않습니다.\n\n소득에서 어느 정도 남기고, 저축 or 투자로 연결시키고 있지만\n그 흐름이 일관되지 않거나, 명확한 목표가 부족할 수 있습니다.\n\n이 구간에 있는 사람들은 대체로 아래같은 습관을 갖고 있습니다:\n✔️ 저축/투자는 있지만 정기적이지 않음 (남으면 함)\n✔️ 목적 없이 예적금 위주, 또는 단기 수익 위주의 투자만 반복\n✔️ 가계부는 있지만 분석이 없고, 계획보다는 감각에 의존함\n\n이런 상태는 의외로, 많은 직장인, 30대 초중반에 흔한 구조입니다.\n\n지금의 삶이 나쁘진 않지만,\n\n“나중에 준비하겠지” 라는 느슨한 태도가\n시간의 복리효과를 빼앗고 있는 것입니다.\n\n📌 지금부터는 ‘얼마 남겼는지’가 아닌 \n     ‘어디에, 왜 남기는지’를 고민하셔야 합니다.\n\n지출 구조를 압박할 필요는 없지만,\n남긴 돈의 흐름에 반드시 의도와 목적을 붙여주셔야\n다음 구간으로 진입할 수 있습니다.\n", "rep_AK177": "소득은 있는데, 돈이 남지 않습니다.\n\n투자는커녕 예적금도 비상금용 잔고가 반복되는 구조일\n가능성이 높습니다.\n\n이 구간의 가장 큰 특징은\n✔️ “나도 저축은 해야지”라고 생각은 하지만\n✔️ 실제로 남기는 구조가 시스템화되어 있지 않다는 것입니다.\n\n그날 그날의 소비, 이벤트성 지출, 구독료, 외식 등으로 인해\n월말이 되면 “이번 달은 좀 힘들었다”는 말로 자위하게 됩니다.\n\n이 상태는 장기적으로 봤을 때\n미래를 준비할 여력도, 현재를 지킬 여유도 없는 구조입니다.\n\n이제는 의지나 결심보다\n\n📌 고정비 구조 점검\n📌 자동이체 기반의 저축/투자 설정\n📌 3개월치 비상금 확보\n\n이 세 가지를 ‘행동’으로 옮겨야 할 시점입니다.\n", "rep_AK178": "이 지점은 ‘돈이 없다’보다 더 무서운 상태입니다.\n‘돈에 대한 태도가 없다’는 뜻이기 때문입니다.\n\n이 구간에 해당하는 사람은 \n대부분 돈이 들어오는 족족 바로 소비하거나\n\n“어차피 모아봤자 의미 없다”\n는 무기력한 마인드를 가지고 있습니다.\n\n또는, 현실이 너무 빠듯하여 여유가 없거나,\n심리적으로 돈이 나를 통제하는 느낌을 받을 수도 있습니다.\n\n이 상태는 시간이 갈수록\n카드값 → 리볼빙 → 소액 대출 → 마이너스통장 등으로\n재무구조가 서서히 망가지는 루프에 진입하게 됩니다.\n\n이제는 반드시 구조를 바꿔야 합니다.\n\n✔️ 지출 분석 없이 ‘절약’부터 하지 마시고\n✔️ 월급을 받고 가장 먼저 자동저축을 실행하십시오\n      (단돈 1만 원도 좋습니다).\n✔️ 고정지출 줄이기보다 ‘의식 전환’이 먼저입니다.\n", "rep_AL175": "\n이 비중에 속한다면 당신은\n\n✔️ 자산의 대부분을 금융시장에 배치해두고 있으며\n✔️ 돈을 현금으로 놔두는 것을 ‘낭비’라 생각하는 성향입니다.\n\n장기적 관점에선 훌륭하지만,\n단기적 리스크 관리가 부족하면\n하락장에서 큰 충격을 받을 수 있는 구조입니다.\n\n또한 이 구조는 소득 흐름이 끊길 경우,\n\n현금성 자산이 부족해 \n비상금 없이 포지션을 깨야 하는 상황이 생길 수 있습니다.\n\n📌 지금 필요한 건 현금흐름의 안전판.\n\n투자 비중을 낮추기보다,\n유동성 자산 확보 + 위기 시 계획을 반드시 세워야 합니다.\n", "rep_AL176": "\n당신은 자산을 단순히 지키는 데서 그치지 않고,\n\n\"불릴 수 있는 자산은 반드시 투자로 운용한다\"는 \n철학을 가진 사람입니다.\n\n자산의 절반 이상을 ETF, 주식, 펀드 등 금융자산에 넣고 있으며\n장기적인 복리효과를 알고 있으며\n단기 수익보다는 자산의 크기를 키우는 데 집중하는 구조입니다.\n\n📌 당신에게 필요한 건 투자의 분산 전략과 타이밍 통제 능력입니다.\n\n지나치게 공격적으로 흐를 경우\n단기 하락장에서 감정적으로 흔들릴 수 있으니,\n\n자동화 시스템과 리스크 분산 포트폴리오를 \n반드시 병행하셔야 합니다.\n\n💡 성향은 훌륭하나, ‘꾸준함’과 ‘분산’이 없다면 \n'수익률'은 일정하지 않습니다.\n", "rep_AL177": "\n당신은 저축과 투자 사이에서 현실적인 균형을 찾는 전략가입니다.\n\n\n불필요한 리스크는 피하면서도,\n\n자산을 단순히 은행에만 묻어두는 건 기회비용이라 생각합니다.\n\n\n이 성향은 리스크 관리와 수익률 관리가 모두 가능한 \n\n이상적인 성향이지만, 성장 속도는 다소 느릴 수 있고,\n\n자산 증식의 규모가 커지기 위해선 더 적극적인 전략이 필요합니다.\n\n\n📌 향후 목표가 더 분명하다면,\n\n투자 비중을 상향하고 리밸런싱 전략을 고려해보시길 권합니다.\n", "rep_AL178": "\n당신은 재무적으로 보수적이고 안정성을 중시하는 타입입니다.\n\n자산의 대부분을 예/적금, 정기예금, CMA, 청약저축 등 \n현금성 자산에 보유하고 있으며,\n투자는 해도 소액, 또는 단기적/소극적 투자에 \n그치는 경우가 많습니다.\n\n✔️ 이런 구조는 위기 상황에 강하지만,\n✔️ 저금리 시대에는 자산 성장 속도가 매우 느릴 수 있습니다.\n\n지금 중요한 건, \"왜 투자를 망설이는가?\" 고민하는 것 입니다.\n\n이 성향은 나쁜 것이 아닙니다.\n\n하지만 \"내가 선택한 전략인지, 회피한 결과인지\"를 \n구분하는 게 핵심입니다. \n\n✔️ 당신에게 맞는 전략은 현금성 비중은 유지하되,\n     안정형 ETF, 연금저축, IRP 등의 중위험 장기 전략을 \n     고려해야 할 타이밍입니다.\n", "rep_B71": "✔ 가계수지비율(Income-to-Expenditure Ratio)\n    = (총소득 - 총지출) / 총소득 × 100\n➡ 가계가 흑자인지 적자인지 판단하는 기본 지표\n➡ 30% 이상이면 건전, 10% 미만이면 저축 부족 상태!", "rep_M71": "✔ 비상금 대비율(EFCR, Emergency Fund Coverage Ratio)\n    = (비상금 / 월평균 지출) × 100\n➡ 갑작스러운 실직, 사고, 질병 등 예기치 못한 상황에서 한 달 지출 기준으로 몇 개월을 버틸 수 있는지를 보여주는 지표\n➡ 300% 미만일 경우 위험 신호 🚨 (일반적으로 300~600% 적정)", "rep_X71": "✔ 부채상환비율(DSR, Debt Service Ratio)\n    = (월간 원리금 상환액 / 월소득) × 100\n➡ 대출 상환 부담이 소득 대비 어느 정도인지 확인\n➡ 40% 초과 시 위험 신호 🚨 (일반적으로 30% 이하가 적정)", "rep_B168": "✔ 부채부담지표 (Debt-to-Asset Ratio, DAR)\n    = (총부채 / 총자산) × 100\n➡ 내가 가진 자산 중 부채가 얼마나 차지하는지를 나타내는 지표\n➡ 즉, 내 자산이 온전히 내 것인지, 아니면 대출인지 보여줌\n➡ 50% 초과 시 재무구조가 불안정하다는 신호 🚨\n    (일반적으로 30~40%가 안정권으로 평가됨)", "rep_M168": "✔ 저축성향(Saving Propensity, SP)\n     = (저축액 / 소득) × 100\n➡ 벌어들인 소득 중 얼마를 저축하는지를 나타내는 지표\n➡ 20% 미만일 경우 재무건전성에 위험 신호 🚨\n    (일반적으로 20~40%는 안정권으로 평가됨)", "rep_X168": "✔ 투자성향 지표 (Investment Allocation Ratio, IAR)\n    = (총투자액 / (총저축액 function period(n) {

  let m1 = sm + n - 1, y1 = sy; if (m1 > 12) { m1 -= 12; y1++; }
  let m2 = m1 + 1, y2 = y1; if (m2 > 12) { m2 = 1; y2++; }
  const start = D(y1, m1, sd <= eom(y1, m1) ? sd : eom(y1, m1));
  const end = sd <= eom(y2, m2) ? D(y2, m2, sd - 1) : D(y2, m2, eom(y2, m2) - 1);
  const daysA = eom(y1, m1) - start.getDate(), daysB = end.getDate();
  const repD = daysA >= daysB ? start : end; // 대표월 (Excel AQ13)
  const off = (start.getDay() - (s.weekStart === '월' ? 1 : 0) + 7) % 7;

function cats(key) { return S.settings.cats[key] || []; }

/* ---------- month computations ---------- */
const TABLES = [
  { title: '수입', keys: ['income'], tk: 'inc' },
  { title: '투자 & 저축', keys: ['saving', 'invest'], tk: 'sav' },
  { title: '변동지출', keys: ['variable'], tk: 'vr' },
  { title: '고정지출', keys: ['fixed'], tk: 'fx' },

    const rows = [];

    }));

function instSchedule(it) {

  for (let k = 1; k <= n; k++) {

    rows.push({ k, date: st ? edate(st, k - 1) : null, prin, intr, pay, bal: Math.abs(bal) < 0.005 ? 0 : bal });
  }

}

}

function depCalc(r) {
  const st = parseD(r.start), en = parseD(r.end), k = r.kind;
  const U = st && en ? ((en.getFullYear() - st.getFullYear()) * 12 + en.getMonth() - st.getMonth()) * num(r.monthly) : 0;
  const AN = !k ? '' : (k === '파킹통장' || k === 'CMA통장') ? (st ? dayDiff(st, today()) : 0) : (st && en ? dayDiff(st, en) : 0);
  const yrs = Math.round(num(AN) / 365), R = num(r.principal), X = num(r.monthly), A = num(r.rate);
  const sav = X * (yrs * 12 + 1) / 2 * A / 12 * yrs * 12;
  let AC = 0; if (k === '예금') AC = R * A * yrs; else if (k === '적금') AC = sav; else if (k === '파킹통장' || k === 'CMA통장') AC = R * A / 365 * num(AN); else AC = R * A / 365 * num(AN) + sav;
  const AF = AC * 0.846; const base = R + U;
  return { U, AN, AC, AF, AI: base ? AF / base : 0, AK: R + U + AF };
}

function download(name, text, type = 'application/json') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp() { const t = new Date(); return `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}`; }
ACTIONS.exportJson = () => { download(`살돈가계부_백업_${stamp()}.json`, JSON.stringify(S, null, 1)); toast('백업 파일을 저장했습니다'); };
ACTIONS.importJson = () => pickFile('.json,application/json', async f => {
  try { const o = JSON.parse(await f.text()); if (!o || !o.settings || !o.months) throw new Error('가계부 백업 파일이 아닙니다');
    if (!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')) return; S = migrate(o); save(); render(); toast('백업을 불러왔습니다'); }
  catch (e) { alert('불러오기 실패: ' + e.message); }
});
ACTIONS.importXlsm = () => pickFile('.xlsm,.xlsx', async f => {
  try { toast('엑셀 파일을 읽는 중…'); const wb = await readXlsx(await f.arrayBuffer()); const res = importWorkbook(wb);
    dialog(`<h3>가져올 내용 확인</h3><div class="small muted" style="margin-bottom:10px">${esc(f.name)}</div><ul class="list">${res.summary.map(s => `<li>${esc(s[0])}<span class="r">${esc(s[1])}</span></li>`).join('')}</ul>
      <div class="note warn" style="margin-top:12px">현재 프로그램의 데이터가 엑셀 파일의 입력값으로 교체됩니다. 필요하면 먼저 백업하세요.</div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-close>취소</button><button class="btn" data-act="exportJson">현재 데이터 백업</button><button class="btn p" id="doImport">가져오기</button></div>`,
      d => { $('#doImport', d).onclick = () => { S = migrate(res.state); save(); d.remove(); go('home'); render(); toast('엑셀 데이터를 가져왔습니다'); }; });
  } catch (e) { console.error(e); alert('엑셀 읽기 실패: ' + e.message); }
});
ACTIONS.resetAll = () => { if (!confirm('모든 데이터를 지우고 처음 상태로 되돌릴까요?\n(되돌릴 수 없습니다. 먼저 백업을 권장합니다)')) return; if (!confirm('정말 초기화할까요?')) return; S = defaultState(); save(); go('home'); render(); toast('초기화했습니다'); };
ACTIONS.newYear = () => {
  if (!confirm('세팅·자산 데이터는 그대로 두고, 월별 기록(1~12월)만 비운 새 해 가계부를 시작할까요?\n먼저 현재 데이터 백업 파일을 저장합니다.')) return;
  ACTIONS.exportJson();
  const p12 = period(12); const nx = addDays(p12.end, 1);
  S.settings.startYear = nx.getFullYear(); S.settings.startMonth = nx.getMonth() + 1;
  for (let i = 1; i <= 12; i++) S.months[i] = blankMonth();
  save(); go('home'); render(); toast(`${S.settings.startYear}년 ${S.settings.startMonth}월부터 새 가계부를 시작합니다`);
};
function pickFile(accept, cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => i.files[0] && cb(i.files[0]); i.click(); }

/* ---------- 파일 연결 자동저장 (Chrome / Edge) ---------- */
const FS_OK = 'showSaveFilePicker' in window;
let fileHandle = null; window.linkedName = '';
function idb(mode, fn) { return new Promise((res, rej) => { const r = indexedDB.open('donsaldon-kit', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => { const tx = r.result.transaction('h', mode); const st = tx.objectStore('h'); const q = fn(st); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }; r.onerror = () => rej(r.error); }); }
window.initFileLink = async () => { if (!FS_OK) return; try { const h = await idb('readonly', s => s.get('file')); if (h) { fileHandle = h; window.linkedName = h.name; const p = await h.queryPermission({ mode: 'readwrite' }); window.linkPerm = p; updateSaveInfo(); if (ROUTE.name === 'data') render(); } } catch (e) { } };
window.fileLinkSave = async () => { if (!fileHandle || window.linkPerm !== 'granted') return; try { const w = await fileHandle.createWritable(); await w.write(JSON.stringify(S)); await w.close(); } catch (e) { window.linkPerm = 'error'; } };
ACTIONS.linkFile = async () => {
  try { const h = await window.showSaveFilePicker({ suggestedName: '살돈가계부_데이터.json', types: [{ description: '가계부 데이터', accept: { 'application/json': ['.json'] } }] });
    fileHandle = h; window.linkedName = h.name; window.linkPerm = 'granted'; await idb('readwrite', s => s.put(h, 'file')); await window.fileLinkSave(); updateSaveInfo(); render(); toast('파일 연결 완료 — 이제 변경할 때마다 이 파일에도 저장됩니다'); }
  catch (e) { if (e.name !== 'AbortError') alert('파일 연결 실패: ' + e.message); }
};
ACTIONS.relink = async () => { if (!fileHandle) return; const p = await fileHandle.requestPermission({ mode: 'readwrite' }); window.linkPerm = p; if (p === 'granted') { await window.fileLinkSave(); toast('연결 파일 저장을 다시 시작합니다'); } render(); };
ACTIONS.openLinked = async () => {
  try { const [h] = await window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] }); const o = JSON.parse(await (await h.getFile()).text());
    if (!o.settings) throw new Error('가계부 데이터 파일이 아닙니다'); if (!confirm('이 파일의 데이터로 바꾸고, 앞으로 이 파일에 자동 저장할까요?')) return;
    S = migrate(o); fileHandle = h; window.linkedName = h.name; window.linkPerm = await h.requestPermission({ mode: 'readwrite' }); await idb('readwrite', s => s.put(h, 'file')); save(); render(); toast('데이터 파일을 열었습니다'); }
  catch (e) { if (e.name !== 'AbortError') alert('열기 실패: ' + e.message); }
};
ACTIONS.unlink = async () => { fileHandle = null; window.linkedName = ''; await idb('readwrite', s => s.delete('file')); updateSaveInfo(); render(); };

function selfCore(memo) { let s = String(memo || '').trim(); for (let k = 0; k < 4; k++) { const t = s.replace(BANK_PRE, ''); if (t === s) break; s = t; } return nz(s.replace(/\(.*$|\d+$|[\s()]+$/g, '')); }
function selfNames() { return (S.settings.selfNames || []).map(nz).filter(x => x.length >= 2); }
function isSelfTx(memo) { const L = selfNames(); if (!L.length || !memo) return false; const c = selfCore(memo); return !!c && L.some(n => c === n || c === n + '님' || (c.startsWith(n) && c.length <= n.length + 2 && /^(님|본인|계좌|통장)?$/.test(c.slice(n.length)))); }
function selfSuggest() { // 가장 자주 나오는 '사람 이름' 모양의 내역 (2~4글자 한글)
  const cnt = {}; for (let n = 1; n <= 12; n++) recs(n).forEach(r => { const c = selfCore(r.memo); if (/^[가-힣]{2,4}$/.test(c) && !/카드|페이|마트|편의|식당|카페|보험|은행|증권|수수료|이자|급여|월급/.test(c)) cnt[c] = (cnt[c] || 0) + 1; });
  const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; return best && best[1] >= 3 ? best[0] : '';
}
function selfPairs() { // 같은 날(±1일) 같은 금액으로 들어오고 나간 쌍 → 내 계좌 이체일 가능성
  const A = []; for (let n = 1; n <= 12; n++) recs(n).forEach(r => { if (num(r.amt) && r.date) A.push({ n, r }); });
  const inc = A.filter(x => x.r.g === '수입' && !isSelfTx(x.r.memo)), out = A.filter(x => x.r.g !== '수입'), used = new Set(), P = [];
  inc.forEach(i => { const di = parseD(i.r.date); const o = out.find(o => !used.has(o) && Math.abs(num(o.r.amt)) === Math.abs(num(i.r.amt)) && Math.abs(dayDiff(parseD(o.r.date), di)) <= 1 && Math.abs(num(i.r.amt)) >= 10000); if (o) { used.add(o); P.push([i, o]); } });
  return P;
}
function selfMatches() { const out = []; for (let n = 1; n <= 12; n++) recs(n).forEach(r => { if (isSelfTx(r.memo)) out.push({ n, r }); }); return out; }

function sHeader(cells) {

function sRowsParse(rows, broker) {

  for (let i = 0; i < Math.min(rows.length, 80); i++) {

    const cv = (r, k) => mp[k] >= 0 ? r[mp[k]] : '';

      const ccy = String(cv(r, 'ccy') || '').toUpperCase(); const code = String(cv(r, 'code') || '').trim();
      const market = /USD|달러|미국|HKD|JPY|CNY|EUR/.test(ccy) || (/^[A-Z]{1,5}(\.[A-Z])?$/.test(code)) ? '해외' : '국내';
      const qty = Math.abs(parseAmt(cv(r, 'qty')) || 0); if (!qty) continue;

        if (!avg && buy) avg = buy / qty; out.holdings.push({ broker, market, code, name, qty, avg: avg || 0, price: cur || (val ? val / qty : 0), currency: market === '해외' ? 'USD' : 'KRW' }); }
      else { const sd = String(cv(r, 'side') || ''); if (!/매수|매도|buy|sell/i.test(sd)) continue; const fd = findDate(cv(r, 'date')); if (!fd) continue;

function pdfToRows(lines) { // 헤더 줄 기준으로 x 위치 정렬된 행 만들기
  for (let i = 0; i < lines.length; i++) for (const key of ['cells', 'raw']) {
    const mp = sHeader(lines[i][key]); if (!mp.kind) continue; const H = lines[i][key]; const rows = [H.map(c => c.t)];
    for (let j = i + 1; j < lines.length; j++) { const ln = lines[j]; if (nz(ln.text) === nz(lines[i].text)) continue; const r = Array(H.length).fill(''); const lastX = Array(H.length).fill(-1e9);
      ln.raw.forEach(c => { let best = 0, bs = -1e9; H.forEach((h, k) => { const ov = Math.min(c.x1, h.x1) - Math.max(c.x0, h.x0); const sc = ov > 0 ? ov : -Math.abs((c.x0 + c.x1) / 2 - (h.x0 + h.x1) / 2); if (sc > bs) { bs = sc; best = k; } }); r[best] = r[best] ? r[best] + (c.x0 - lastX[best] > 1.5 ? ' ' : '') + c.t : c.t; lastX[best] = c.x1; });

PAGES.chat = {
  render() {
    const n = currentPeriodIndex(), mc = n ? monthCalc(n) : null; const L = chLog();

    return `<div class="chwrap"><div class="chhead"><div><b>💬 채팅으로 입력</b><div class="small muted">${mc ? `${mc.p.label}월 · 지출 <b>${fmt(mc.spend)}</b> · 수입 ${fmt(mc.inc)}${n ? ` · <a href="#/month/${n}">내역 보기 ›</a>` : ''}` : '가계부 기간 밖'}</div></div>
      <button class="btn sm ghost" data-act="chPref">⚙️</button></div>
      <div class="chlog" id="chlog">${hello}${L.map(m => m.who === 'me' ? `<div class="cb me"><div>${esc(m.text).replace(/\n/g, '<br>')}</div></div>` : m.ids ? `<div class="cb bot">${m.ids.map(chCard).join('')}</div>` : `<div class="cb bot"><div>${esc(m.text)}</div></div>`).join('')}</div>
      <div class="mchips">${['💳 카드', '💵 현금', '🏦 이체', '어제 ', '점심 ', '커피 ', '택시 '].map(c => `<button data-act="chChip" data-v="${esc(c.replace(/^\S+ (?=카드|현금|이체)/, ''))}">${c}</button>`).join('')}</div>
      <form class="mform" id="chform" onsubmit="return false"><textarea id="chin" rows="1" placeholder="예) pc방에서 만 원 식사로 씀 현금"></textarea><button type="submit" id="chgo">➤</button></form></div>`;
  },
  after() {
